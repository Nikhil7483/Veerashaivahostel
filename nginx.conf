# Nginx Production Configuration for Veerashaiva Lingayath Boys Hostel
# Domain: veerashaivahostel.run.place
# Server IP: 152.57.56.178

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # HTTP Server - Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name veerashaivahostel.run.place;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS Server - Production SSL/TLS
    server {
        listen 443 ssl http2;
        server_name veerashaivahostel.run.place;

        # SSL Certificates (update paths if using custom certs)
        # ssl_certificate     /etc/letsencrypt/live/veerashaivahostel.run.place/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/veerashaivahostel.run.place/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Frontend Static Files (React/Vite Build)
        root C:/Users/Samsung/Desktop/finalhost/HOSTEL/frontend/dist;
        index index.html;

        # SPA Routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Backend API Proxy -> 127.0.0.1:8000
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Health Endpoints
        location /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Uploaded Files
        location /uploads/ {
            proxy_pass http://127.0.0.1:8000/uploads/;
            proxy_set_header Host $host;
        }
    }
}
